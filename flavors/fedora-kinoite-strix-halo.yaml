# Hardware flavor: AMD Ryzen AI MAX+ 395 / Radeon 8060S — "Strix Halo" (gfx1151).
# Detected: PCIID=1002:1586 GFX=gfx1151 RAM=121GiB CPU_CORES=32 KERNEL=7.0.10-201.fc44.
# VALIDATED on this machine (2026-06-25): Ollama 0.24.0 on docker.io/ollama/ollama:rocm
#   detected library=ROCm compute=gfx1151, ran qwen3-coder:30b at "100% GPU" (ollama ps),
#   from rootless podman with `--security-opt label=disable`, no sudo / no reboot / no GPU groups.
extends: fedora-kinoite

gpu:
  vendor: amd
  gfx: gfx1151
  path: rocm                         # CONFIRMED working (library=ROCm). NOT vulkan (hangs on some models).
  compute_nodes_open: true           # /dev/kfd + /dev/dri/renderD128 world-rw → NO render/video group, NO reboot
  device_flags: ["--device", "/dev/kfd", "--device", "/dev/dri"]
  rootless_selinux_flag: "--security-opt label=disable"  # CONFIRMED needed for rootless GPU access on enforcing SELinux
  env:
    HSA_OVERRIDE_GFX_VERSION: "11.5.1"   # CONFIRMED — gfx1151 recognition
    OLLAMA_FLASH_ATTENTION: "1"          # CONFIRMED accepted
    # HSA_ENABLE_SDMA: not load-bearing on Strix Halo per research; leave default.

llm_image: docker.io/ollama/ollama:rocm  # currently resolves to Ollama 0.24.0 (known-good)
llm_version_constraint:
  known_good: "0.24.0"                # correctly reports full memory
  avoid: ["0.30.0", "0.30.1", "0.30.2"]  # rocm builds regress to ~2 GiB on gfx1151 (ollama #16462)

model:
  primary: qwen3-coder:30b           # ~19 GB on disk; fits the 64 GiB carveout with room to spare
  context_length: 131072             # validated: 262144 (256K) ran fine for 30B at the 64 GiB carveout;
                                      # 131072 is a safe default leaving host headroom — raise after VRAM expansion

memory:
  ram_gib: 121
  vram_gib: 64                       # GPU-ADDRESSABLE TOTAL (what Ollama sees). MEASURED 2026-06-30:
                                     #   4 GiB dedicated VRAM (BIOS UMA carveout, mem_info_vram_total)
                                     # + 60.7 GiB GTT (system RAM mapped on demand; ttm.pages_limit
                                     #   default = RAM/2 = 15923746 pages). The 30B model loads into GTT.
                                     # Expand GPU memory by raising ttm.pages_limit (see vram_expansion).
  # --- VRAM EXPANSION (human-required: BIOS + sudo karg + reboot) ---------------------------
  # On Strix Halo the GPU is NOT capped at the carveout — GTT maps system RAM dynamically.
  # AMD official guidance: set BIOS carveout to MINIMUM and raise ttm.pages_limit instead.
  # VERIFIED against AMD ROCm docs + adversarial failure-mode review (2026-06-25).
  # STATUS: NOT NEEDED YET — qwen3-coder:30b runs at 100% GPU in the 64 GiB carveout. Expansion
  # only helps 70B-dense / 100B+ MoE / very-long context; it does NOT raise tok/s for models that
  # already fit (Strix Halo is bandwidth-bound, ~213 GB/s). Apply only when you move to bigger models.
  vram_expansion:
    needed_now: false
    pages_per_gib: 262144            # pages = GiB * 262144 (4 KiB pages) — CONFIRMED-OFFICIAL
    kernel_floor: "6.18.4"           # CONFIRMED-OFFICIAL; this box runs 7.0.10 → clears it
    recommended_pages_limit: 23592960  # ~90 GiB — comfortable, leaves ~31 GiB host headroom
    do_not_exceed: 28835840          # ~110 GiB = CONFIRMED multi-user OOM-kill regime (llama.cpp #22372)
    steps:                           # HUMAN-REQUIRED (BIOS entry + sudo + reboot); apply only when needed:
      - "BIOS: set UMA Frame Buffer / Dedicated VRAM to MINIMUM (~0.5 GB) — AMD-recommended; frees stranded RAM"
      - "sudo rpm-ostree kargs --append=ttm.pages_limit=23592960   # ~90 GiB; append ONE karg, verify, then reboot"
      - "verify: cat /sys/module/ttm/parameters/pages_limit  AND rocminfo/amdgpu_top show the larger pool"
    do_not_use:
      - "ttm.page_pool_size — not in AMD docs; only pages_limit matters; leave default (RAM/2)"
      - "amd_iommu=off — AMD marks it 'Not recommended' (USB4 DMA exposure, loses VFIO, panic risk); use iommu=pt if ever"
      - "amdgpu.gttsize — deprecated; silently ignored on this kernel"
    recovery: "bad karg won't boot? GRUB -> previous deployment -> boot -> 'sudo rpm-ostree rollback'"
    caveats:
      - "GTT is allocated on demand — a high pages_limit costs nothing until used; the OOM risk is capping near total RAM"
      - "keep linux-firmware current; gfx1151 amdgpu still evolving — pin-and-test kernel bumps"
