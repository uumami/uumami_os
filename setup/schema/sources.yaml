# sources.yaml — WHERE every updatable thing comes from, and at WHICH version.
#
# config.yaml decides WHETHER something is enabled. This file decides WHAT gets installed.
# `uu update` reads both: enabled here + toggled on there = installed.
#
# WHY PINS ARE NOT OPTIONAL
# A skill is not a library — it is instructions your agent reads and acts on, with your agent's
# full permissions. Tracking a floating branch means whoever controls that repo controls what
# your agents do, on every box, silently, at your next update. A malicious change to prose looks
# like a documentation tweak; there is no checksum that saves you.
# So: every source carries a `pin` (tag or commit SHA). Bumping it is an edit to this file, which
# means every change to how your agents behave is a reviewable commit in YOUR repo.
# `uu update` shows you old -> new and will not move a pin on its own.
#
# kinds:
#   npm         installed with `npm --prefix` into a versioned dir under ~/Agents (no root)
#   marketplace a Claude Code plugin from a marketplace that already pins a SHA upstream
#   git         cloned at `pin`, materialised read-only
#   flatpak     desktop app on the HOST (never rpm layering on an image-based OS)
#   image       lives in dev_base; updating it means rebuild + recreate (rare, on purpose)

agents:
  # Every CLI agent is an npm package, so they share one mechanism: install at a pinned version
  # into ~/Agents/versions/<stamp>, then repoint a symlink. No image rebuild, no box recreate.
  claude_code: { kind: npm, package: "@anthropic-ai/claude-code",   pin: "2.1.220", bin: claude }
  codex:       { kind: npm, package: "@openai/codex",               pin: "0.142.2", bin: codex }
  opencode:    { kind: npm, package: "opencode-ai",                 pin: "1.17.11", bin: opencode }
  pi:          { kind: npm, package: "@earendil-works/pi-coding-agent", pin: "0.80.2", bin: pi }
  omp:         { kind: npm, package: "@oh-my-pi/pi-coding-agent",   pin: "16.1.18", bin: omp }

  # hermes is a git checkout with a vendored Python venv, not an npm package. Its installer
  # takes --dir (so it can live in the shared tree like everything else) and --commit (so it can
  # be pinned, which the dev_base module comment predates — it says no pin flag exists).
  # Pinned to the commit actually installed and tested here, not to a moving branch.
  hermes:
    kind: script
    url: https://hermes-agent.nousresearch.com/install.sh
    repo: https://github.com/NousResearch/hermes-agent.git
    pin: 3b9a963b8e5cdb804a422755bed9a60fcd778273
    # PIN CAVEAT — weaker than the npm agents, and worth knowing. The pin fixes the GIT COMMIT.
    # The installer then tries a hash-verified Python install from the repo's uv.lock, that
    # fails (upstream's lockfile is stale against their own pyproject: "lockfile needs to be
    # updated, but --locked was provided"), and it falls back to resolving fresh from PyPI. So
    # two installs of this same commit can pull different library versions. Closing that would
    # mean vendoring a lockfile ourselves and maintaining it — recorded here rather than
    # papered over, so "pinned" is not read as a stronger promise than it is.
    bin: hermes
    # Where the real executable lands inside --dir, and which inherited variables must be
    # cleared to reach it. Declared per agent because it is a property of THAT installer, not a
    # rule update.sh should assume about every script-installed agent.
    bin_path: venv/bin/hermes
    unset_env: "PYTHONPATH PYTHONHOME"
    # --skip-setup: the wizard wants a human. --non-interactive: never block on a prompt nobody
    # can answer. --skip-browser: the installer's own bare `npm install` at this workspaces root
    # pulls EVERY workspace (Electron desktop app and all) just to reach the browser tooling,
    # and fails the whole install if that errors. We do the browser step ourselves below, so a
    # failure there costs browser tools instead of the agent.
    # Data still goes to $HERMES_HOME in the profile, so it stays per box.
    args: "--non-interactive --skip-setup --skip-browser"
    # Optional second stage. `optional: true` means a failure is a warning, never a lost agent —
    # the same outcome-over-exit-code rule the installer taught us. {dir} is the install dir.
    #
    # REQUIRES the build toolchain in dev_base (images/dev_base/modules/05-build-toolchain.layer):
    # this monorepo pulls node-pty, a native module, and without gcc/make node-gyp dies in
    # seconds. Until that image is rebuilt, this stage is expected to fail and say so.
    #
    # AGENT_BROWSER_EXECUTABLE_PATH is upstream's supported way to reuse an existing browser
    # instead of downloading a second Chromium. Set it to a browser on this machine to skip the
    # ~150MB download; leave it empty to let Playwright fetch its own.
    post_install:
      - name: browser-tools
        cmd: "npm install --no-fund --no-audit"
        optional: true
        timeout: 1200
      - name: browser-engine
        cmd: "npx --yes playwright install chromium"
        optional: true
        timeout: 900

# Build-time environment for agent installs. Declared here, never in update.sh: the script
# evaluates generic rules and knows no variable names, so adding a case is a manifest edit.
#
# Each entry is either `NAME: value`, or a mapping:
#   value: <what to set>
#   unless_gpu_vendor: <vendor>   skip this entry when the merged gpu.vendor equals it
npm_env:
  # onnxruntime-node (pulled in transitively by omp) downloads CUDA execution-provider binaries
  # from GitHub on ANY linux/x64 host, without checking which GPU is present — hundreds of MB
  # that an AMD or Apple machine can never load. That download is what wedged the first install
  # here. `skip` is upstream's own documented switch.
  # The rule is conditional on the FLAVOR, not on this machine: an NVIDIA host using this repo
  # still gets the CUDA binaries, because gpu.vendor decides.
  ONNXRUNTIME_NODE_INSTALL_CUDA:
    value: skip
    unless_gpu_vendor: nvidia

skills:
  # Anthropic's own marketplace, which already pins a SHA upstream. The safest source available:
  # curated, and the pin is not ours to forget.
  superpowers:
    kind: marketplace
    marketplace: claude-plugins-official
    plugin: superpowers
    harnesses: [claude]

  # DELIBERATELY UNSET. Searching turns up several unaffiliated repos and forks for each, with no
  # canonical upstream. Choosing one for you would be exactly the supply-chain shrug this file
  # exists to prevent — you are the one who has to trust it. Fill in `repo` + `pin`, flip the
  # toggle in config.yaml, and `uu update skills` will take it from there.
  openspec:
    kind: git
    repo: ""            # candidates: github.com/chyiiiiiiiiiiii/openspec-skills · sudokar/openspec-plus
    pin: ""             # use a tag or commit SHA, never a branch name
    harnesses: [claude]
  i_have_adhd:
    kind: git
    repo: ""            # candidates: github.com/ayghri/i-have-adhd (appears upstream of the forks)
    pin: ""
    harnesses: [claude]

apps:
  # Flathub ids. Browser DATA separation is per box and comes from the aliases, not from
  # installing a browser more than once.
  firefox:   { kind: flatpak, id: org.mozilla.firefox,   profile_flag: "--profile" }
  librewolf: { kind: flatpak, id: io.gitlab.librewolf-community, profile_flag: "--profile" }
  chromium:  { kind: flatpak, id: org.chromium.Chromium, profile_flag: "--user-data-dir" }
  chrome:    { kind: flatpak, id: com.google.Chrome,     profile_flag: "--user-data-dir" }
  # Slack has workspaces, not profile directories. There is no per-box separation to give it, so
  # it declares none rather than implying isolation it cannot deliver.
  slack:     { kind: flatpak, id: com.slack.Slack }
