# Codex local-Ollama provider. Drop at ~/.codex/config.toml in the tenant profile.
# Launch:  codex --profile qwen-ollama   (or the quick path: codex --oss)
[model_providers.ollama]
name = "Ollama"
base_url = "http://127.0.0.1:11434/v1"

[profiles.qwen-ollama]
model_provider = "ollama"
model = "qwen3-coder:30b"
