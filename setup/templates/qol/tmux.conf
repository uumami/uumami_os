# uumami_os minimal tmux config — deployed by setup/lib/deploy-tmux.sh (SG11).
# Deliberately small: sensible prefix, mouse, history, readable status, intuitive splits.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g default-terminal "tmux-256color"

# splits that match intuition: | vertical, - horizontal (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# status bar: session name + box identity
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold] #S #[default]| "
set -g status-right "#H %H:%M"
