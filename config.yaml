# uumami_os — general configuration (OS/hardware-agnostic).
# OS- and hardware-specific values live in flavors/ and are merged OVER this file.
# Secrets (API keys, tokens) NEVER go here — they are initialized per tenant after first entry.

flavor: fedora-kinoite-strix-halo     # active flavor (declares `extends: fedora-kinoite`)

paths:
  containers: ~/Containers            # Containerfiles, modules, service defs
  profiles:   ~/Profiles              # one isolated HOME per tenant
  models:     ~/Models                # model weights (shared read-only into llm_server)
  code:       ~/Code                  # source workspaces, mounted per tenant
  agents:     ~/Agents                # shared agent tree (uu update agents); :ro in tenant boxes

container_engine: podman              # rootless, no daemon

llm:
  backend: ollama                     # ollama | lemonade
  host: 127.0.0.1                     # loopback only — never 0.0.0.0
  port: 11434

agents:                               # CLI/terminal agents, baked into dev_base as .layer modules
  claude_code: true                   # Anthropic (cloud default)
  codex: true                         # OpenAI (cloud default)
  opencode: true                      # configurable: local Ollama or cloud
  pi: true                            # configurable
  omp: true                           # oh-my-pi (terminal agent, IDE wired in)
  hermes: true                        # NousResearch general-purpose assistant
ide:
  cursor: true                        # only standalone GUI IDE; exported via distrobox-export --app

# Skills: instruction sets the agents READ and act on. They are behaviour, not libraries, so
# every one is pinned in setup/schema/sources.yaml and updated only when you bump the pin —
# that way a change to how your agents behave is always a commit in this repo.
# Deployed read-only into every box via ~/Agents; `uu update skills`.
skills:
  superpowers: true                   # official Anthropic marketplace entry (SHA-pinned upstream)
  openspec: false                     # OFF: no canonical repo — set the source in sources.yaml first
  i_have_adhd: false                  # OFF: pick a fork in sources.yaml first (several exist)

# Desktop apps. On an image-based host (Kinoite) these are Flatpaks, never rpm layering — no
# reboot, and the sandbox is stronger than running a browser inside a box (a box can see the
# whole host home). Browser DATA is per box: the aliases point each browser at $HOME/browser/…,
# and $HOME inside a box is that box's profile. `uu update apps`.
apps:
  firefox: true
  librewolf: true
  chromium: true
  chrome: false                       # OFF: Flathub build is a third-party repackage, not Google
  slack: true                         # note: one account context; it has no per-profile model

tenants:
  default_tier: "2a"                  # 0 | 1 | 2a | 2b | 3  (2a = dedicated user + distrobox)
  browser_default: shared             # shared | per-tenant | per-session
